{% comment %}The country gates of the location's access list (buildAclFile geo_gates), before its IP and password rules.
Included in every location the gated location contains too (the built-in PHP one): rewrite module directives are not
inherited by a nested location. A refusal rewrites to /.npmpro-geo/<page> (_npmpro_pages.conf), outside the
location's error_page; a drop closes the connection.{% endcomment %}
{% for gate in access_list.geo_gates %}
  # country rules of access list {{ gate.id }} (checked before the IP and password rules)
  if ($npmpro_geo_{{ gate.id }} = 0) { {% if gate.drop %}return 444;{% else %}rewrite ^ /.npmpro-geo/{{ npmpro_pages.geo_denied }}? last;{% endif %} }
{% endfor %}
