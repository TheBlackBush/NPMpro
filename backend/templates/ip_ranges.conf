{%- assign trusted = env.TRUST_IP | split: " " | concat: ip_ranges -%}
{%- for range in trusted %}
{%- if range != "" %}
  set_real_ip_from {{ range }};
{%- endif %}
{%- endfor %}
  geo $realip_remote_addr $npmpro_trusted_proxy {
    default 0;
{%- for range in trusted %}
{%- if range != "" %}
    {{ range }} 1;
{%- endif %}
{%- endfor %}
  }
