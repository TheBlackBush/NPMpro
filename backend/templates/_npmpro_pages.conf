{% for page in npmpro_page_locations %}
  # landing page (Settings, Landing pages): served with the visitor's IP, the time and the status filled in (SSI)
  location = /.npmpro-page/{{ page.name }} {
    internal;
    ssi on;
    alias {{ page.file }};
    default_type text/html;
    auth_basic off;
    auth_request off;
    allow all;
    more_set_headers "Cache-Control: no-store";
  }
{% endfor %}
