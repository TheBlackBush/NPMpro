{% for page in npmpro_page_locations %}
  # landing page (Settings, Landing pages): served with the visitor's IP, the time and the status filled in (SSI)
  location = /.npmpro-page/{{ page.name }} {
    internal;
    ssi on;
    alias {{ page.file }};
    default_type text/html;
    auth_basic off;
    auth_request off;
    allow all;
    more_set_headers "Cache-Control: no-store";
  }
{% endfor %}
{% for target in npmpro_geo_targets %}
  # country rules: a gate of a location rewrites here, so its 403 is answered outside the location (whose forward
  # auth error_page would make it a redirect or a challenge); the denied page, or nginx's own 403 without one
  location = /.npmpro-geo/{{ target }} {
    internal;
    {% if target != "" %}error_page 403 /.npmpro-page/{{ target }};{% endif %}
    return 403;
  }
{% endfor %}
