<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:,">
<title data-t="title">@@TITLE@@</title>
<style>
@property --a{syntax:"<angle>";initial-value:0deg;inherits:false}
:root{--bg:#f4f4f5;--dot:rgba(9,9,11,.12);--fg:#09090b;--muted:#52525b;--card:#fff;--line:#e4e4e7;--chip:#f4f4f5;--accent:@@ACCENT@@;--tint:@@TINT@@}
@media (prefers-color-scheme:dark){:root{--bg:#09090b;--dot:rgba(255,255,255,.10);--fg:#fafafa;--muted:#a1a1aa;--card:#111114;--line:#27272a;--chip:#18181b;--accent:@@ACCENT_DARK@@;--tint:@@TINT_DARK@@}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:18px;color:var(--fg);background:radial-gradient(var(--dot) 1px,transparent 1px) 0 0/22px 22px,var(--bg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.logo{height:64px;width:auto}
.logo-dark{display:none}
@media (prefers-color-scheme:dark){.logo-light{display:none}.logo-dark{display:block}}
.frame{position:relative;max-width:460px;width:100%;border-radius:15px;padding:1.5px;background:var(--line)}
.frame::before,.frame::after{content:"";position:absolute;inset:0;border-radius:15px;padding:1.5px;background:conic-gradient(from var(--a),transparent 0 72%,var(--accent) 88%,transparent 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.frame::after{filter:blur(6px);opacity:.9}
.card{position:relative;background:var(--card);border-radius:13.5px;padding:26px 26px 24px;text-align:center}
.ic{position:relative;margin:0 auto;width:48px;height:48px;border-radius:50%;background:var(--tint);color:var(--accent);display:flex;align-items:center;justify-content:center}
h1{font-size:22px;margin:16px 0 0;font-weight:700;letter-spacing:-.01em}
.bar{width:32px;height:3px;border-radius:2px;background:linear-gradient(90deg,#FFAC1C,#FF1457,#DB00DC,#5415FF);margin:10px auto}
.code{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;margin-bottom:14px}
.gap{height:4px}
.text{margin:0;color:var(--muted);line-height:1.6;font-size:14px}
.witty{margin:10px 0 0;font-size:13px;color:var(--muted);font-style:italic}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px;font:12px ui-monospace,monospace;color:var(--muted)}
.chip{background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:5px 9px}
.captcha{margin:14px auto 0;min-height:66px;display:flex;justify-content:center}
.foot{font-size:12px;color:var(--muted)}
@keyframes spin{to{--a:360deg}}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulse{0%{transform:scale(.85);opacity:.6}100%{transform:scale(1.5);opacity:0}}
@media (prefers-reduced-motion:no-preference){.frame{animation:up .5s ease-out both}.frame::before,.frame::after{animation:spin 3.2s linear infinite}.ic::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid currentColor;animation:pulse 2.2s ease-out infinite}}
</style>
@@HEAD_EXTRA@@
</head>
<body>
<img class="logo logo-light" src="@@LOGO_LIGHT@@" alt="NPMpro">
<img class="logo logo-dark" src="@@LOGO_DARK@@" alt="NPMpro">
<main class="frame"><div class="card">
<div class="ic" aria-hidden="true">@@ICON@@</div>
<h1 data-t="title">@@TITLE@@</h1>
<div class="bar"></div>
@@CODE@@
<p class="text" data-t="text">@@TEXT@@</p>
<p class="witty" data-t="witty">@@WITTY@@</p>
@@CAPTCHA@@
@@CHIPS@@
</div></main>
<div class="foot" data-t="footer">@@FOOTER@@</div>
<script type="application/json" id="npmpro-texts">@@TEXTS@@</script>
<script>@@SCRIPT@@</script>
</body>
</html>
