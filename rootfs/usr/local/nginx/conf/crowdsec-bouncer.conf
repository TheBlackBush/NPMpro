lua_shared_dict crowdsec_cache 50m;
init_by_lua_block {
  cs = require "crowdsec"
  local ok, err = cs.init("/data/crowdsec/crowdsec.conf", "crowdsec-npmplus-bouncer/v1.0.19")
  if ok == nil then
  ngx.log(ngx.ERR, "[Crowdsec] " .. err)
  error()
  end
  ngx.log(ngx.ALERT, "[Crowdsec] Initialisation done")
}

map $remote_addr $unix {
  default 0;
  "~unix:" 1;
}

access_by_lua_no_postpone on;
# unix socket requests skip the bouncer, and the admin UI when Settings, CrowdSec leaves it out ($npmpro_crowdsec_skip
# is set in the admin server by /data/npmpro/nginx/crowdsec-admin.conf)
access_by_lua_block {
  local cs = require "crowdsec"
  if ngx.var.unix == "1" or ngx.var.npmpro_crowdsec_skip == "1" then
  ngx.log(ngx.DEBUG, "[Crowdsec] request ignoring...")
  ngx.exit(ngx.DECLINED)
  else
  cs.Allow(ngx.var.remote_addr)
  end
}

init_worker_by_lua_block {
  cs = require "crowdsec"
  local mode = cs.get_mode()
  if string.lower(mode) == "stream" then
  ngx.log(ngx.INFO, "Initializing stream mode for worker " .. tostring(ngx.worker.id()))
  cs.SetupStream()
  end

  if ngx.worker.id() == 0 then
  ngx.log(ngx.INFO, "Initializing metrics for worker " .. tostring(ngx.worker.id()))
  cs.SetupMetrics()
  end
}
