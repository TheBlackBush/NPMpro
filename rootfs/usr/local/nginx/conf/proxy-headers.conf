# ip headers
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;

# general headers
proxy_set_header Host $host$is_request_port$request_port;
proxy_set_header X-Forwarded-Proto $npmpro_forwarded_proto;
proxy_set_header X-Forwarded-Host $host$is_request_port$request_port;

# the bouncer sends the request id to the AppSec only: a client-sent one never reaches an upstream
proxy_set_header X-Npmpro-Request-Id "";

# websockets
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# 0rtt header
proxy_set_header Early-Data $ssl_early_data;
