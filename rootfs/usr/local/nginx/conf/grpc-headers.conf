# ip headers
grpc_set_header X-Forwarded-For $remote_addr;
grpc_set_header X-Real-IP $remote_addr;

# general headers
grpc_set_header Host $host$is_request_port$request_port;
grpc_set_header X-Forwarded-Proto $npmpro_forwarded_proto;
grpc_set_header X-Forwarded-Host $host$is_request_port$request_port;

# the bouncer sends the request id to the AppSec only: a client-sent one never reaches an upstream
grpc_set_header X-Npmpro-Request-Id "";

# 0rtt header
grpc_set_header Early-Data $ssl_early_data;
