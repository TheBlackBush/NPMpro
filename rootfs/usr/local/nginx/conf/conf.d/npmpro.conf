upstream npmpro {
  server unix:/run/npmpro.sock;
}

upstream goaccess {
  server unix:/run/goaccess.sock;
}

server {
  set $npmpro_host_id npmpro;
  server_name "";
  listen 0.0.0.0:81 ssl;
  listen [::]:81 ssl;
  ssl_reject_handshake on;
  return 444;
}

server {
  set $npmpro_host_id npmpro;
  listen 0.0.0.0:81 ssl bind reuseport deferred multipath so_keepalive=on default_server;
  listen [::]:81 ssl bind reuseport deferred multipath so_keepalive=on default_server;

  server_name _;
  # Settings, Logs & monitoring, TLS handshake log: this server's error logs plus tls.log at info, or a comment. The
  # handshake of a connection to the admin UI port that carries no known name is logged with this server's error logs
  include /data/npmpro/nginx/tls-log.conf;
  # the CSP of the CrowdSec captcha page on the admin UI (location = /.npmpro/crowdsec-captcha): the ban page's until
  # the file below sets the one of the configured captcha provider (Settings, CrowdSec, Captcha provider)
  set $npmpro_captcha_csp "default-src 'none'; script-src 'sha256-0Nk5tIBxxYWeoLmnaKWiNsls+svkJY3NGNDDg2y9i0A='; style-src 'unsafe-inline'; img-src data:; font-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests; sandbox allow-scripts;";
  # Settings, CrowdSec, Admin UI and CrowdSec: a comment (checked), set $crowdsec_disable_appsec 1; (bans) or set $npmpro_crowdsec_skip 1; (out)
  include /data/npmpro/nginx/crowdsec-admin.conf;
  include /data/npmpro/nginx/default-cert.conf;

  if ($npmpro_forwarded_proto = "http") {
    return 301 https://$host$is_request_port$request_port$request_uri;
  }

  client_max_body_size 1m;
  include noindex-nofollow.conf;
  more_set_headers "X-Frame-Options: DENY";
  more_set_headers "Referrer-Policy: no-referrer";
  more_set_headers "Cross-Origin-Opener-Policy: same-origin";
  more_set_headers "Cross-Origin-Resource-Policy: same-origin";
  more_set_headers "Cross-Origin-Embedder-Policy: require-corp";
  more_set_headers "Permissions-Policy: accelerometer=(), ambient-light-sensor=(), aria-notify=(), attribution-reporting=(), autoplay=(), bluetooth=(), browsing-topics=(), camera=(), captured-surface-control=(), ch-ua-high-entropy-values=(), compute-pressure=(), cross-origin-isolated=(), deferred-fetch=(), deferred-fetch-minimal=(), display-capture=(), encrypted-media=(), fullscreen=(), gamepad=(), geolocation=(), gyroscope=(), hid=(), identity-credentials-get=(), idle-detection=(), language-detector=(), language-model=(), local-fonts=(), local-network=(), local-network-access=(), loopback-network=(), magnetometer=(), microphone=(), midi=(), on-device-speech-recognition=(), otp-credentials=(), payment=(), picture-in-picture=(), private-state-token-issuance=(), private-state-token-redemption=(), publickey-credentials-create=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), speaker-selection=(), storage-access=(), summarizer=(), translator=(), usb=(), web-share=(), window-management=(), xr-spatial-tracking=()";

  location / {
    more_set_headers "Content-Security-Policy: default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests; require-trusted-types-for 'script'; trusted-types 'none'; sandbox;";
    more_set_headers "Cache-Control: no-cache";
    root /app/frontend;
    try_files $uri /index.html;
  }

  location = /index.html {
    more_set_headers "Content-Security-Policy: default-src 'none'; script-src-elem 'self'; style-src-elem 'self'; connect-src 'self'; font-src 'self'; img-src 'self' data:; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests;";
    more_set_headers "Cache-Control: no-cache";
    root /app/frontend;
  }

  location /assets/ {
    more_set_headers "Content-Security-Policy: default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests; require-trusted-types-for 'script'; trusted-types 'none'; sandbox;";
    more_set_headers "Cache-Control: public, max-age=31536000, immutable";
    root /app/frontend;
  }

  location /images/avatar/ {
    auth_request /api/auth;
    more_set_headers "Content-Security-Policy: default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests; require-trusted-types-for 'script'; trusted-types 'none'; sandbox;";
    more_set_headers "Cache-Control: private, no-cache";
    alias /data/public/avatar/;
  }

  location /images/gravatar/ {
    auth_request /api/auth;
    more_set_headers "Content-Security-Policy: default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests; require-trusted-types-for 'script'; trusted-types 'none'; sandbox;";
    more_set_headers "Cache-Control: private, no-cache";
    alias /data/public/gravatar/;
  }

  # based on https://github.com/xavier-hernandez/goaccess-for-nginxproxymanager/blob/main/resources/nginx/nginx.conf
  location ~ ^/goaccess(\.css|\.js)?$ {
    auth_request /api/auth/admin;
    more_set_headers "Content-Security-Policy: default-src 'none'; script-src 'unsafe-eval'; script-src-elem 'self' 'unsafe-hashes' 'sha256-kbHtQyYDQKz4SWMQ8OHVol3EC0t3tHEJFPCSwNG9NxQ='; style-src-elem 'self'; style-src-attr 'unsafe-inline'; connect-src 'self'; font-src 'self' data:; img-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests;";
    more_set_headers "Cache-Control: no-store";
    include proxy-headers.conf;
    proxy_set_header Accept-Encoding "";
    if ($http_upgrade = "websocket") {
      proxy_pass http://goaccess;
    }

    root /tmp/goa;
    try_files $uri /index.html =502;
    sub_filter 'WebSocket(str)' 'WebSocket(window.location.toString().split("#")[0].replace(window.location.protocol, window.location.protocol == "https:" ? "wss:" : "ws:"))';
    sub_filter_once on;
    sub_filter_types text/javascript;
  }

  location ~ ^/api/docs(/|$) {
    more_set_headers "Content-Security-Policy: default-src 'none'; script-src-elem 'self'; style-src-elem 'self' 'sha256-/jDKvbQ8cdux+c5epDIqkjHbXDaIY8RucT1PmAe8FG4=' 'sha256-BeXIQk2DxxoDrgnnoH683KOnlwQvO0HH1fT4VFQTi8g=' 'sha256-RL3ie0nH+Lzz2YNqQN83mnU0J1ot4QL7b99vMdIX99w='; style-src-attr 'unsafe-hashes' 'sha256-ezdv1bOGcoOD7FKudKN0Y2Mb763O6qVtM8LT2mtanIU='; connect-src 'self'; font-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests;";
    more_set_headers "Cache-Control: private, no-cache";
    include proxy-headers.conf;
    proxy_set_header Accept-Encoding "";
    proxy_pass http://npmpro;
  }

  # login button icon: public and cacheable, the frontend adds ?v=<updated_on> so a new icon gets a new URL
  location = /api/oidc/icon {
    more_set_headers "Content-Security-Policy: default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests; sandbox;";
    # only a successful answer is cached, errors (missing file, backend restarting) must not stick for a day
    more_set_headers "Cache-Control: no-store";
    more_set_headers -s 200 "Cache-Control: public, max-age=86400";
    include proxy-headers.conf;
    proxy_set_header Accept-Encoding "";
    proxy_pass http://npmpro;
  }

  # the landing page previews (Settings, Landing pages; the ban and captcha previews of Settings, CrowdSec): the
  # page's inline styles and data images, and only the built-in pages' own script (sha256 of
  # backend/landing-pages/page-script.js), so they show the viewer's language and a custom page's scripts never run
  location ~ ^/api/settings/(landing-pages/preview/|crowdsec/preview/(ban|captcha)$) {
    more_set_headers "Content-Security-Policy: default-src 'none'; script-src 'sha256-0Nk5tIBxxYWeoLmnaKWiNsls+svkJY3NGNDDg2y9i0A='; style-src 'unsafe-inline'; img-src data:; font-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests; sandbox allow-scripts;";
    more_set_headers "Cache-Control: no-store";
    include proxy-headers.conf;
    proxy_set_header Accept-Encoding "";
    proxy_pass http://npmpro;
  }

  # the CrowdSec ban and captcha pages on the admin UI (npmpro_pages.lua sends them here): the CSP of the landing page
  # previews instead of the strict one of the request's location; the captcha page has the CSP of the configured
  # provider (its origins only, form-action 'self'; no origins without a provider) and no COEP, so the provider's
  # script and frame load and the form posts back to the page
  location = /.npmpro/crowdsec-ban {
    internal;
    set $npmpro_crowdsec_skip 1;
    more_set_headers "Content-Security-Policy: default-src 'none'; script-src 'sha256-0Nk5tIBxxYWeoLmnaKWiNsls+svkJY3NGNDDg2y9i0A='; style-src 'unsafe-inline'; img-src data:; font-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests; sandbox allow-scripts;";
    more_set_headers "Cache-Control: no-store";
    content_by_lua_block {
      require("npmpro_pages").serve("ban")
    }
  }

  location = /.npmpro/crowdsec-captcha {
    internal;
    set $npmpro_crowdsec_skip 1;
    more_set_headers "Content-Security-Policy: $npmpro_captcha_csp";
    more_set_headers "Cross-Origin-Embedder-Policy: unsafe-none";
    more_set_headers "Cache-Control: no-store";
    content_by_lua_block {
      require("npmpro_pages").serve("captcha")
    }
  }

  location = /api/backups/upload {
    client_max_body_size 2g;
    client_body_timeout 300s;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_send_timeout 600s;
    more_set_headers "Content-Security-Policy: default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests; require-trusted-types-for 'script'; trusted-types 'none'; sandbox;";
    more_set_headers "Cache-Control: no-store";
    include proxy-headers.conf;
    proxy_set_header Accept-Encoding "";
    proxy_pass http://npmpro;
  }

  location = /api/backups/import {
    client_max_body_size 200m;
    client_body_timeout 300s;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_send_timeout 600s;
    more_set_headers "Content-Security-Policy: default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests; require-trusted-types-for 'script'; trusted-types 'none'; sandbox;";
    more_set_headers "Cache-Control: no-store";
    include proxy-headers.conf;
    proxy_set_header Accept-Encoding "";
    proxy_pass http://npmpro;
  }

  # custom landing pages (up to 1 MiB each) travel in these bodies
  location ~ ^/api/(settings/landing-pages|nginx/(proxy-hosts|dead-hosts|access-lists))(/|$) {
    client_max_body_size 16m;
    more_set_headers "Content-Security-Policy: default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests; require-trusted-types-for 'script'; trusted-types 'none'; sandbox;";
    more_set_headers "Cache-Control: no-store";
    include proxy-headers.conf;
    proxy_set_header Accept-Encoding "";
    proxy_pass http://npmpro;
  }

  location ~ ^/api(/|$) {
    more_set_headers "Content-Security-Policy: default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests; require-trusted-types-for 'script'; trusted-types 'none'; sandbox;";
    more_set_headers "Cache-Control: no-store";
    include proxy-headers.conf;
    proxy_set_header Accept-Encoding "";
    proxy_pass http://npmpro;
  }
}
