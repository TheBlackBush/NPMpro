name: npmpro
services:
  npmpro:
    container_name: npmpro
    restart: unless-stopped
    image: docker.io/blackbush/npmpro:latest # or ghcr.io/theblackbush/npmpro:latest
    pull_policy: always
    network_mode: host
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETGID
      - SETUID # runs the nginx workers (internet facing) as the unprivileged npmpro-worker user; also needed with PUID/PGID and for the inbuilt php-fpm
      - CHOWN # gives the npmpro-worker user read access to what it serves; also needed with PUID/PGID
#      - BPF # required if you set NGINX_QUIC_BPF to true
#      - PERFMON # required if you set NGINX_QUIC_BPF to true
#      - NET_ADMIN # required if you set NGINX_QUIC_BPF to true
#      - FOWNER # required if you change PUID/PGID
#      - DAC_OVERRIDE # required if you change PUID/PGID
#      - NET_RAW # required if you need the ping command inside the NPMpro container
    security_opt:
      - no-new-privileges:true
#    dns: # only set this if you need/want to override the default DNS server
#      - 192.168.1.1 # default for unifi/opnsense/pfsense
#      - 192.168.8.1 # default for glinet
#      - 192.168.178.1 # default for avm/fritz
#      - 94.140.14.15 # Public AdGuard DNS
#      - 94.140.15.16 # Public AdGuard DNS
#      - 2a10:50c0::bad1:ff # Public AdGuard DNS
#      - 2a10:50c0::bad2:ff # Public AdGuard DNS
    volumes:
      - "/opt/npmpro:/data"
#      - "/var/www:/var/www" # optional, if you want to use NPMpro directly as a webserver for html/php
#      - "/path/to/old/npm/letsencrypt/folder:/etc/letsencrypt" # Only needed for initial migration from original nginx-proxy-manager to this fork, remove after migration
    environment:
      # Basics
      - "TZ=Etc/UTC" # change to your time zone ("TZ identifier" from https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List); set here it wins over the Time zone setting (Settings, Advanced), which then shows "Set by TZ"; keep at least one active variable here, compose refuses an empty environment list; an invalid value stops the container from starting
#      - "PUID=1000" # user id to run as, a number, default 0 (root); with network_mode host and a non-root PUID you may need sysctl net.ipv4.ip_unprivileged_port_start=0 to bind ports below 1024 (this allows every non-root service to bind them)
#      - "PGID=1000" # group id to run as, a number, default 0 (root), requires PUID
#      - "NPM_PORT=82" # port of the NPMpro web UI, default 81, change it to run several instances with network_mode host
#      - "IPV4_BINDING=127.0.0.1" # IPv4 address nginx listens on for your hosts, default 0.0.0.0 (all)
#      - "IPV6_BINDING=[::1]" # IPv6 address (in brackets) nginx listens on for your hosts, default [::] (all)
#      - "NPM_IPV4_BINDING=127.0.0.1" # IPv4 address of the web UI, default 0.0.0.0 (all)
#      - "NPM_IPV6_BINDING=[::1]" # IPv6 address (in brackets) of the web UI, default [::] (all)
#      - "NPM_LISTEN_LOCALHOST=true" # web UI only on localhost (IPv4 and IPv6), overrides NPM_IPV4_BINDING/NPM_IPV6_BINDING, default false
#      - "HTTP_PORT=8080" # tcp port for http, changing it may break the certbot http challenge, default 80
#      - "HTTPS_PORT=8443" # tcp and udp port for https, changing it may break the certbot http challenge, default 443
#      - "DISABLE_HTTP=true" # nginx does not listen on the http port, default false
#      - "DISABLE_IPV6=true" # no IPv6 listeners and no IPv6 resolver in nginx, overrides IPV6_BINDING/NPM_IPV6_BINDING, default false

      # Network and TLS at startup
#      - "LISTEN_PROXY_PROTOCOL=true" # http and https listeners (proxy/redirection/404 hosts and the default host) expect proxy protocol, turns on LISTEN_PROXY_PROTOCOL_HTTP, LISTEN_PROXY_PROTOCOL_HTTPS and DISABLE_H3_QUIC, default false
#      - "LISTEN_PROXY_PROTOCOL_HTTP=true" # http listeners expect proxy protocol, default false
#      - "LISTEN_PROXY_PROTOCOL_HTTPS=true" # https listeners expect proxy protocol, turns on DISABLE_H3_QUIC, default false
#      - "DISABLE_H3_QUIC=true" # nginx does not listen on the https port over udp: no HTTP/3 (QUIC) for any host, even when enabled in the UI, not recommended, default false
#      - "ENABLE_MPTCP=true" # enables multipath TCP, needs network_mode host, recommended, default false
#      - "NGINX_QUIC_BPF=true" # enables quic_bpf (https://nginx.org/en/docs/http/ngx_http_v3_module.html#quic_bpf), needs the BPF, PERFMON and NET_ADMIN caps (see cap_add above), recommended, default false
#      - "NGINX_WORKER_PROCESSES=8" # worker_processes, a number or auto (one per CPU thread, no limit); default one per CPU thread the container may use, at most 4, enough for a home or small business proxy. Also a setting (Settings > nginx), setting it here locks the field
#      - "NGINX_WORKER_CONNECTIONS=1024" # worker_connections, a number, default 512. Also a setting (Settings > nginx), setting it here locks the field
#      - "NGINX_WORKER_SHUTDOWN_TIMEOUT=1h" # after a reload (every host save, certificate renewal), how long old nginx workers keep their open connections (websockets, downloads, streams) before nginx closes them and the clients reconnect; an nginx time: a number with ms, s, m, h or d, combinable like 1h30m; 0 = no limit (old workers stay until their last client disconnects, which can take days); default 1h. Also a setting (Settings > nginx), setting it here locks the field
#      - "NGINX_FORCE_X25519MLKEM768=true" # only X25519MLKEM768 key exchange, nothing else (this also means no TLS 1.2), turns on NGINX_DISABLE_TLS12 and off NGINX_TRUST_SECPR1; most browsers support it, other clients may not, default false. Also a setting (Settings > nginx), setting it here locks the field
#      - "NGINX_DISABLE_TLS12=true" # disables TLS 1.2, which is still safe with the settings NPMpro uses; only if all your clients support TLS 1.3, default false. Also a setting (Settings > nginx), setting it here locks the field
#      - "NGINX_TRUST_SECPR1=false" # the secp521r1, secp384r1 and secp256r1 curves for key exchange, default true, turn off if all your clients support X25519MLKEM768 or x25519. Also a setting (Settings > nginx), setting it here locks the field
#      - "NGINX_TRUST_RSA_PKCS1=true" # the rsa_pkcs1_sha512/384/256 signature algorithms, default false, turn on if you use an RSA key and a client does not support RSA-PSS. Also a setting (Settings > nginx), setting it here locks the field
#      - "NGINX_LOG_NOT_FOUND=true" # log requests for missing files (404) to the docker logs, unrelated to access logs, default false. Also a setting (Settings > nginx), setting it here locks the field

      # Modules and PHP
#      - "NGINX_LOAD_NJS_MODULE=true" # loads the njs module, needs your own configuration, default false. Also a setting (Settings > nginx), setting it here locks the field
#      - "NGINX_LOAD_LDAP_MODULE=true" # loads the ldap module, needs your own configuration, default false. Also a setting (Settings > nginx), setting it here locks the field
#      - "NGINX_LOAD_NTLM_MODULE=true" # loads the ntlm module, needs your own configuration, default false. Also a setting (Settings > nginx), setting it here locks the field
#      - "NGINX_LOAD_VHOST_TRAFFIC_STATUS_MODULE=true" # loads the virtual host traffic status module, needs your own configuration, default false. Also a setting (Settings > nginx), setting it here locks the field
#      - "PHP83=true" # starts the built-in php-fpm 8.3, default false, supported but not recommended: prefer a separate php-fpm container
#      - "PHP83_APKS=php83-curl php83-openssl" # php 8.3 extensions to install (https://pkgs.alpinelinux.org/packages?branch=v3.24&repo=community&arch=x86_64&name=php83-*), also turns on PHP83, default none
#      - "PHP84=true" # starts the built-in php-fpm 8.4, default false, supported but not recommended: prefer a separate php-fpm container
#      - "PHP84_APKS=php84-curl php84-openssl" # php 8.4 extensions to install (https://pkgs.alpinelinux.org/packages?branch=v3.24&repo=community&arch=x86_64&name=php84-*), also turns on PHP84, default none
#      - "PHP85=true" # starts the built-in php-fpm 8.5, default false, supported but not recommended: prefer a separate php-fpm container
#      - "PHP85_APKS=php85-curl php85-openssl" # php 8.5 extensions to install (https://pkgs.alpinelinux.org/packages?branch=v3.24&repo=community&arch=x86_64&name=php85-*), also turns on PHP85, default none
#      - "PHP_APKS=php-pecl-apcu php-pecl-redis" # extra php- packages (names must start with php-, https://pkgs.alpinelinux.org/packages?branch=v3.24&repo=community&arch=x86_64&name=php-*), needs PHP83, PHP84 or PHP85, not recommended: use PHP83_APKS, PHP84_APKS or PHP85_APKS, default none

      # Database and first start
      # MariaDB/MySQL and PostgreSQL may work but are unsupported, have no advantage over SQLite and are not recommended; Settings > Database moves between SQLite, MariaDB/MySQL and PostgreSQL (env vars lock that section). Without these variables NPMpro uses SQLite in /data/npmpro/database.sqlite
#      - "DB_MYSQL_HOST=127.0.0.1" # MariaDB/MySQL host, used when DB_MYSQL_HOST, DB_MYSQL_USER and DB_MYSQL_NAME are set
#      - "DB_MYSQL_PORT=3306" # default 3306
#      - "DB_MYSQL_USER=npmpro"
#      - "DB_MYSQL_PASSWORD=<password>"
#      - "DB_MYSQL_NAME=npmpro"
#      - "DB_MYSQL_SSL=true" # TLS to the database, default false
#      - "DB_MYSQL_SSL_REJECT_UNAUTHORIZED=false" # with DB_MYSQL_SSL: reject an untrusted server certificate, default true
#      - "DB_MYSQL_SSL_VERIFY_IDENTITY=false" # with DB_MYSQL_SSL: check the server name in its certificate, default true
#      - "DB_POSTGRES_HOST=127.0.0.1" # PostgreSQL host, used when DB_POSTGRES_HOST, DB_POSTGRES_USER and DB_POSTGRES_NAME are set (and no MySQL host is)
#      - "DB_POSTGRES_PORT=5432" # default 5432
#      - "DB_POSTGRES_USER=npmpro"
#      - "DB_POSTGRES_PASSWORD=<password>"
#      - "DB_POSTGRES_NAME=npmpro"
#      - "INITIAL_ADMIN_EMAIL=<initial@email.tld>" # email of the first admin, only with INITIAL_ADMIN_PASSWORD and only on the first start; without both the setup page in the web UI creates the first user
#      - "INITIAL_ADMIN_PASSWORD=<initial-password>" # password of the first admin (8 to 255 characters), only with INITIAL_ADMIN_EMAIL and only on the first start
#      - "INITIAL_DEFAULT_PAGE=444" # default site on the first start: 404, 444, redirect, congratulations or html, default congratulations
#      - "COOKIE_SECRET=some-random-string" # secret that signs the session cookie; without it a new random secret is used at every start, so every restart, recreate and upgrade signs all users out; set a static random string to keep them signed in
#      - "ENABLE_PRERUN=true" # runs the scripts in /opt/npmpro/prerun/*.sh before NPMpro starts (see README), default false
#      - "NC_AIO=true" # Nextcloud All-in-One mode: creates a proxy host for NC_DOMAIN to 127.0.0.1:11000 with a new certificate, and DISABLE_HTTP defaults to true, default false
#      - "NC_DOMAIN=cloud.example.com" # the Nextcloud domain, required with NC_AIO=true
#      - "NODE_TLS_REJECT_UNAUTHORIZED=0" # turns off certificate checks for every request the backend makes (not nginx), for example to an OIDC issuer with a self-signed certificate, GitHub version checks, Gravatar, reachability checks and Cloudflare IP updates; avoid it if you can

      # ACME account (certificate authority)
#      - "ACME_SERVER=https://acme.zerossl.com/v2/DV90" # ACME directory URL, default https://acme-v02.api.letsencrypt.org/directory (Let's Encrypt); Google Public CA: https://dv.acme-v02.api.pki.goog/directory, ZeroSSL: https://acme.zerossl.com/v2/DV90
#      - "ACME_EMAIL=your-email" # email address for the ACME account, required for ZeroSSL and Google Public CA
#      - "ACME_EAB_KID=123456789abcdef" # External Account Binding key id, not supported by Let's Encrypt, optional for ZeroSSL (on their site: Developer), required for Google Public CA (https://cloud.google.com/certificate-manager/docs/public-ca-tutorial#request-key-hmac); needs ACME_EAB_HMAC_KEY and ACME_EMAIL
#      - "ACME_EAB_HMAC_KEY=123456789abcdef" # External Account Binding HMAC key, see ACME_EAB_KID

      # Settings you can also change in the web UI
      # The web UI (Settings) is the normal place for these. A variable set here wins over the saved value and locks its
      # field in the UI ("Set by <variable>"). Fields marked "Restart required" in the UI (TZ above, GOA and GOACLA) apply
      # at the next container start; the others apply on save.

      # Certificates & TLS
#      - "ACME_KEY_TYPE=rsa" # ecdsa or rsa, default and recommended ecdsa
#      - "ACME_KEY_SIZE=4096" # ecdsa: secp256r1, secp384r1 or secp521r1 (default secp384r1); rsa: 2048, 3072 or 4096 (default 4096), an rsa size only together with ACME_KEY_TYPE=rsa
#      - "ACME_PROFILE=shortlived" # ACME profile, must be offered by the ACME server, "none" for the server default; default shortlived with Let's Encrypt, else none; clients that require a Common Name do not work with shortlived and tlsserver certificates
#      - "ACME_MUST_STAPLE=true" # marks new certificates as must-staple and turns on ACME_OCSP_STAPLING, default false (true for ZeroSSL and Google Public CA); Let's Encrypt refuses it
#      - "ACME_OCSP_STAPLING=true" # OCSP stapling for ACME certificates, turns TLS certificate compression off, default false (true for ZeroSSL and Google Public CA)
#      - "ACME_SERVER_TLS_VERIFY=false" # check the TLS certificate of ACME_SERVER, default and recommended true
#      - "CUSTOM_OCSP_STAPLING=true" # OCSP stapling for uploaded (custom) certificates, turns TLS certificate compression off, default false
#      - "CERTBOT_RUN_INTERVAL=12" # hours between renewal checks, 1 to 499, default 3
#      - "DEFAULT_CERT_ID=1" # id of the certificate for unknown host names and the web UI, default 0 (built-in placeholder certificate)
#      - "ECH_ROTATION_INTERVAL=3" # hours between runs of your ECH script (/opt/npmpro/tls/ech/cron.sh), 1 to 24, default 1

      # Network
#      - "TRUST_IP=10.0.0.0/8 192.168.1.5" # space separated IPv4/IPv6 addresses or CIDR ranges of proxies in front of NPMpro that may pass the real client IP, default empty
#      - "TRUST_CLOUDFLARE=true" # fetch and trust the Cloudflare IP ranges, read the Cloudflare notes in the README first, default false

      # Forward authentication (default upstreams for the Auth Request option of proxy hosts, unrelated to OIDC)
      # scheme + ip/hostname/domain + port (or scheme + name of a cu_ upstream block), no path; a host's own value wins
#      - "AUTH_REQUEST_ANUBIS_UPSTREAM=http://127.0.0.1:8923"
#      - "AUTH_REQUEST_TINYAUTH_UPSTREAM=http://127.0.0.1:3000"
#      - "AUTH_REQUEST_OAUTH2PROXY_UPSTREAM=http://127.0.0.1:4180"
#      - "AUTH_REQUEST_VOIDAUTH_UPSTREAM=http://127.0.0.1:3000"
#      - "AUTH_REQUEST_AUTHELIA_UPSTREAM=http://127.0.0.1:9091"
#      - "AUTH_REQUEST_AUTHENTIK_UPSTREAM=https://127.0.0.1:9443" # currently only works with the embedded outpost
#      - "AUTH_REQUEST_ANUBIS_USE_CUSTOM_IMAGES=false" # use your images from /opt/npmpro/public/anubis (happy.webp, reject.webp, pensive.webp), default true when all three files exist and are not empty

      # Logs & monitoring
#      - "LOGROTATE=true" # Write log files: access log (/opt/npmpro/nginx/logs/access.log), stream log and error log (level warn) on disk, rotated daily, default false (GOA turns it on too); it does not turn on traffic statistics (TRAFFIC_STATS does)
#      - "LOGROTATIONS=7" # rotated log files kept, 1 to 1000, default 3
#      - "GOA=true" # GoAccess report under /goaccess of the web UI (admins only), applies at the next start, default false; it turns on LOGROTATE (Write log files), not traffic statistics; GeoIP in the report uses the databases in /opt/npmpro/goaccess/geoip (Settings, GeoIP)
#      - "GOACLA=--agent-list --real-os --double-decode --anonymize-ip --anonymize-level=2 --keep-last=7 --with-output-resolver --no-query-string" # your own GoAccess options instead of the GoAccess fields in the UI (they are then locked), applies at the next start, default built from those fields: --agent-list --real-os --double-decode --anonymize-ip --anonymize-level=1 --keep-last=30 --with-output-resolver --no-query-string
#      - "TRAFFIC_STATS=true" # traffic statistics (Monitoring page), also writes the access log, default false
#      - "TRAFFIC_RETENTION_DAYS=30" # days the hourly statistics are kept, 7 to 365, default 30 (per-minute counts are kept for 24 hours)
#      - "TRAFFIC_SHOW_IPS=true" # also store the top visitor IPs, turning it off deletes them, default false
#      - "TRAFFIC_UNIQUE_VISITORS=true" # count unique visitors per host and day with a keyed hash of the IP (not the IP), turning it off deletes the hashes, default false
#      - "TRAFFIC_VISITORS_CAP=100000" # visitors counted per host and day, 1000 to 1000000, default 100000

      # GeoIP (NPMpro downloads the GeoLite2 databases itself, no geoipupdate container needed)
#      - "GEOIP_ACCOUNT_ID=<your-account-id>" # MaxMind account id
#      - "GEOIP_LICENSE_KEY=<your-license-key>" # MaxMind license key
#      - "GEOIP_EDITIONS=GeoLite2-Country GeoLite2-ASN" # space separated: GeoLite2-Country, GeoLite2-ASN, GeoLite2-City, default GeoLite2-Country GeoLite2-ASN

      # Authentication (OIDC sign-in for the web UI); with the four connection variables set, OIDC is active without enabling it in the UI
#      - "OIDC_ISSUER_URL=https://..." # issuer URL, must start with https://
#      - "OIDC_CLIENT_ID=..." # client id
#      - "OIDC_CLIENT_SECRET=..." # client secret
#      - "OIDC_REDIRECT_DOMAIN=<domain-ip>[:<port>]" # domain or ip (with port if not 443) you open NPMpro with, no scheme and no path; the callback URL is https://<this>/api/oidc/callback
#      - "OIDC_REQUIRE_VERIFIED_EMAIL=false" # refuse users whose provider has not verified their email, default true
#      - "OIDC_DISABLE_PASSWORD=true" # turns off email/password sign-in, set it to false to restore password sign-in, default false
#      - "OIDC_SKIP_MFA=true" # skip the second factor after an OIDC sign-in, default false

      # Advanced (Time zone: TZ at the top)
#      - "DISABLE_NGINX_BEAUTIFIER=true" # do not format the configs NPMpro writes, useful when nginxbeautifier fails on non-standard custom/advanced configs, default false
#      - "DISABLE_GRAVATAR=true" # no Gravatar profile pictures, applies to a user at their next profile save, default false

