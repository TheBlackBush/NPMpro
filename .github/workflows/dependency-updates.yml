# The rules are on develop: renovate.json and .github/scripts. This file only starts them on a schedule, which GitHub
# reads from the default branch.
name: dependency-updates
on:
  schedule:
    # Off the hour, as GitHub delays or drops scheduled runs at busy times. The second run is a fallback: after a
    # first run that worked, it only updates the same branches and PRs.
    - cron: "17 2 * * 1"
    - cron: "17 8 * * 1"
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  renovate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          persist-credentials: false
      - uses: renovatebot/github-action@1c0cf989c02653fba0efe7ca5772338860ca71dc # v46.3.12
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          configurationFile: .github/renovate-global.json
          renovate-version: 44.222.0

  sources:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          persist-credentials: false
      - run: bash .github/scripts/update-sources.sh
      - uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          base: develop
          branch: update-sources
          delete-branch: true
          commit-message: update patches and pinned sources
          title: update patches and pinned sources
          body: Hashes and files that have no version Renovate can track, from update-sources.sh.
