# The rules are on develop: renovate.json and .github/scripts. This file only starts them on a schedule, which GitHub
# reads from the default branch.
name: Dependency Updates
on:
  schedule:
    # Off the hour, as GitHub delays or drops scheduled runs at busy times. The second run is a fallback: after a
    # first run that worked, it only updates the same branches and PRs.
    - cron: "17 2 * * 1"
    - cron: "17 8 * * 1"
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Check Out Develop
        with:
          ref: develop
          persist-credentials: false
      - uses: renovatebot/github-action@acdd6bda8b035c99ce59d5675816af2aa65a1774 # v46.3.14
        name: Run Renovate
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          configurationFile: .github/renovate-global.json
          renovate-version: 44.247.2

  sources:
    name: Patches and Sources
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Check Out Develop
        with:
          ref: develop
          persist-credentials: false
      - run: bash .github/scripts/update-sources.sh
        name: Update Sources
      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        name: Open Pull Request
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          base: develop
          branch: update-sources
          delete-branch: true
          commit-message: update patches and pinned sources
          title: update patches and pinned sources
          body: Hashes and files that have no version Renovate can track, from update-sources.sh.

  develop-image:
    name: Weekly Develop Image
    # The first run of the week builds :develop again, so its Alpine packages are refreshed weekly even in a week
    # without a push (the image keys its package layer on the ISO week). The fallback run skips it.
    if: github.event.schedule == '17 2 * * 1' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run docker.yml --repo "$GITHUB_REPOSITORY" --ref develop
        name: Start the Develop Build
        env:
          GH_TOKEN: ${{ github.token }}

  shadcn-drift:
    name: shadcn Drift Report
    # The first run of the week compares the generated shadcn components with the registry and keeps one open issue
    # (found by its label) with the result; the fallback run skips it. It skips with a notice while develop has no drift
    # script. When the script fails, the issue shows what it printed and the job fails.
    if: github.event.schedule == '17 2 * * 1' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Check Out Develop
        with:
          ref: develop
          persist-credentials: false
      - name: Check the Drift Script
        id: script
        run: |
          if [ -f .github/scripts/shadcn-drift.sh ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::develop has no .github/scripts/shadcn-drift.sh yet, skipping the drift report"
          fi
      - if: steps.script.outputs.found == 'true'
        uses: ./.github/actions/setup
        name: Set Up Node and pnpm
      - if: steps.script.outputs.found == 'true'
        run: pnpm install --frozen-lockfile
        name: Install Dependencies
        working-directory: frontend
      - name: Drift Report
        id: drift
        if: steps.script.outputs.found == 'true'
        working-directory: frontend
        run: |
          status=0
          sh ../.github/scripts/shadcn-drift.sh > "$RUNNER_TEMP/drift.md" 2> "$RUNNER_TEMP/drift.err" || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            {
              echo
              echo "## The report failed"
              echo
              echo "\`shadcn-drift.sh\` exited with $status in [this run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID):"
              echo
              echo '```'
              cat "$RUNNER_TEMP/drift.err"
              echo '```'
            } >> "$RUNNER_TEMP/drift.md"
          fi
      - name: Update the Issue
        if: steps.script.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: shadcn drift report
          LABEL: shadcn-drift
        # the list API by label, not the search index: no lag, and an issue a person opens with the same title stays theirs
        run: |
          gh label create "$LABEL" --repo "$GITHUB_REPOSITORY" --force --color FBCA04 \
            --description "The weekly shadcn drift report"
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$LABEL" --state all --limit 1 \
            --json number,state --jq '.[0] // empty | "\(.number) \(.state)"')"
          if [ -n "$issue" ]; then
            number="${issue% *}"
            if [ "${issue#* }" = CLOSED ]; then
              gh issue reopen "$number" --repo "$GITHUB_REPOSITORY"
            fi
            gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/drift.md"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --label "$LABEL" \
              --body-file "$RUNNER_TEMP/drift.md"
          fi
      - name: Fail on a Report Error
        if: steps.script.outputs.found == 'true' && steps.drift.outputs.status != '0'
        env:
          STATUS: ${{ steps.drift.outputs.status }}
        run: |
          echo "::error::shadcn-drift.sh exited with $STATUS (the issue shows its output)"
          exit 1
