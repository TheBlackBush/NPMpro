# The rules are on develop: renovate.json and .github/scripts. This file only starts them on a schedule, which GitHub
# reads from the default branch.
name: dependency-updates
on:
  schedule:
    # Off the hour, as GitHub delays or drops scheduled runs at busy times. The second run is a fallback: after a
    # first run that worked, it only updates the same branches and PRs.
    - cron: "17 2 * * 1"
    - cron: "17 8 * * 1"
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  renovate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          persist-credentials: false
      - uses: renovatebot/github-action@acdd6bda8b035c99ce59d5675816af2aa65a1774 # v46.3.14
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          configurationFile: .github/renovate-global.json
          renovate-version: 44.222.0

  sources:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          persist-credentials: false
      - run: bash .github/scripts/update-sources.sh
      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          base: develop
          branch: update-sources
          delete-branch: true
          commit-message: update patches and pinned sources
          title: update patches and pinned sources
          body: Hashes and files that have no version Renovate can track, from update-sources.sh.

  develop-image:
    # The first run of the week builds :develop again, so its Alpine packages are refreshed weekly even in a week
    # without a push (the image keys its package layer on the ISO week). The fallback run skips it.
    if: github.event.schedule == '17 2 * * 1' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run docker.yml --repo "$GITHUB_REPOSITORY" --ref develop
        env:
          GH_TOKEN: ${{ github.token }}
