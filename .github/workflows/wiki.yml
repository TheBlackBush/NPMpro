name: Wiki
on:
  push:
    branches:
      - develop
    paths:
      - 'wiki/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: clone the wiki
        env:
          WIKI_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git
        run: |
          if ! git clone --depth 1 --branch master "$WIKI_URL" "$RUNNER_TEMP/wiki"; then
            echo "::error::Could not clone the wiki of ${GITHUB_REPOSITORY}. Create one page in the Wiki tab of the repository first (this creates the wiki repository), then run this workflow again."
            exit 1
          fi
      - name: replace the wiki content with wiki/
        run: |
          find "$RUNNER_TEMP/wiki" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a wiki/. "$RUNNER_TEMP/wiki/"
      - name: commit and push when changed
        working-directory: ${{ runner.temp }}/wiki
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki is up to date"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Sync wiki from ${GITHUB_SHA::7}"
          git push origin HEAD:master
