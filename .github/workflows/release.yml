name: Release
on:
  push:
    tags:
      - "v*.*.*"
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    if: ${{ github.repository_owner == 'TheBlackBush' }}
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tags: ${{ steps.version.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: sh .github/scripts/release-version.sh .version "$TAG" >> "$GITHUB_OUTPUT"

  publish:
    needs: version
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      tags: ${{ needs.version.outputs.tags }}
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}

  release:
    needs: [version, publish]
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - name: github release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes
