name: test
on:
  push:
    branches:
      - develop
      - main
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
        env:
          POSTGRES_USER: npmpro
          POSTGRES_PASSWORD: ci-throwaway
          POSTGRES_DB: npmpro_test_unit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U npmpro -d npmpro_test_unit"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 24
      mysql:
        image: mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
        env:
          MYSQL_ROOT_PASSWORD: ci-throwaway-root
          MYSQL_DATABASE: npmpro_test_unit
          MYSQL_USER: npmpro
          MYSQL_PASSWORD: ci-throwaway
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u npmpro -pci-throwaway --silent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 36
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm install --frozen-lockfile
      - name: no known high or critical advisories in production dependencies
        run: pnpm audit --prod --audit-level high
      - name: lint and format
        run: pnpm biome ci
      - name: openapi schema
        run: node validate-schema.js
      - name: unit tests with the coverage floor
        run: pnpm run coverage # fails on a failed test or below coverage-floor.json; the summary is in this log
      - name: data folder move
        run: sh test/migrate-data-folder.test.sh
      - name: tests on real database servers
        shell: bash
        env:
          POSTGRES_NPMPRO_HOST: 127.0.0.1
          POSTGRES_NPMPRO_PORT: "5432"
          POSTGRES_NPMPRO_USER: npmpro
          POSTGRES_NPMPRO_PASS: ci-throwaway
          MYSQL_NPMPRO_HOST: 127.0.0.1
          MYSQL_NPMPRO_PORT: "3306"
          MYSQL_NPMPRO_USER: npmpro
          MYSQL_NPMPRO_PASS: ci-throwaway
          TEST_PG_URL: postgres://npmpro:ci-throwaway@127.0.0.1:5432/npmpro_test_unit
          TEST_MYSQL_URL: mysql://npmpro:ci-throwaway@127.0.0.1:3306/npmpro_test_unit
        # one file at a time: they share one database and most start by dropping it; outside c8, the floor reads the step above
        run: |
          set -o pipefail
          node --test --test-concurrency=1 --test-reporter=tap \
            test/backup-merge-pg.test.js \
            test/backup-schedule-migration.test.js \
            test/database-copy.test.js \
            test/database-move.test.js \
            test/database-schema.test.js \
            test/database-target.test.js \
            test/database-values.test.js \
            test/rename-migration-servers.test.js \
            test/servers-mysql.test.js \
            test/servers-postgres.test.js \
            test/traffic-totals-servers.test.js | tee "$RUNNER_TEMP/servers.tap"
          if grep '# SKIP' "$RUNNER_TEMP/servers.tap" | grep -v 'rename migration on mariadb'; then
            echo "::error::a real-server test was skipped"
            exit 1
          fi

  frontend:
    runs-on: ubuntu-slim
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm install --frozen-lockfile
      - name: no known high or critical advisories in production dependencies
        run: pnpm audit --prod --audit-level high
      - name: lint and format
        run: pnpm biome ci
      - name: translations sorted
        run: |
          ./translations/sort-locale.sh
          git diff --exit-code -- translations
      - name: translation keys exist
        run: ./translations/check-keys.sh
      - name: every language has every key
        run: ./translations/check-locale.sh
      - name: every translation key is used
        run: node translations/check-unused.js
      - name: unit tests with the coverage floor
        # the floor covers src/modules, the code with a test harness (measured 98.63, 95.19, 97.34); node's own
        # --test-coverage-* flags read 98.5 as 98, so scripts/coverage-floor.js checks the decimals
        run: |
          set -o pipefail
          node --test --experimental-test-coverage --test-coverage-include='src/modules/**' 'src/**/*.test.js' \
            | tee "$RUNNER_TEMP/coverage.txt"
          node scripts/coverage-floor.js 98.5 95.1 97.2 < "$RUNNER_TEMP/coverage.txt"
      - name: build
        run: pnpm vite build
      - name: no Tabler or Bootstrap in the bundle
        # tabler-theme is the kept localStorage key of the theme (src/modules/Theme.js), not Tabler code
        run: |
          if grep -rnoE 'data-bs-|@popperjs|tblr|tabler[a-z-]*' dist | grep -v ':tabler-theme$'; then
            echo "Tabler or Bootstrap code in dist/"
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca # master
        with:
          check_together: 'yes'
      - name: dockerfile
        run: |
          curl -sSfL https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64 -o "$RUNNER_TEMP/hadolint"
          chmod +x "$RUNNER_TEMP/hadolint"
          git ls-files '*Dockerfile' | xargs -n1 "$RUNNER_TEMP/hadolint" --ignore DL3018 --ignore DL3003 --ignore DL3013
      - name: workflows
        run: |
          curl -sSfL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz | tar -xz -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -ignore SC2086 -ignore SC2012
      - name: json syntax
        run: git ls-files '*.json' | xargs -n1 jq empty
      - name: old project name
        run: sh .github/scripts/check-names.sh
      - name: compose.yaml variables
        run: sh .github/scripts/check-compose-envs.sh
      - name: release version script
        run: sh .github/scripts/release-version.test.sh
      - name: update scripts stop on a failed download or a bad hash
        run: sh .github/scripts/update-sources.test.sh
      - name: nginx config format
        run: |
          npx --yes nginxbeautifier@1.0.19 -s 2 -r rootfs/usr/local/nginx/conf
          git diff --exit-code -- rootfs/usr/local/nginx/conf
      - uses: codespell-project/actions-codespell@e3258cca84ce02b0bb36a3d41f2c18f719a0cc1a # v2.4.3
        with:
          check_filenames: true
          check_hidden: true
          skip: pnpm-lock.yaml,./frontend/translations,./frontend/patches
          ignore_words_list: afterAll,alog,clen,Nd,hasTable,MapPin
