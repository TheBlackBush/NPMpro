name: test
on:
  push:
    branches:
      - develop
      - main
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-slim
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      - name: lint and format
        run: pnpm biome ci
      - name: openapi schema
        run: node validate-schema.js
      - name: unit tests
        run: node --test 'test/*.test.js' # a directory argument is not supported by node --test before Node 23
      - name: data folder move
        run: sh test/migrate-data-folder.test.sh

  frontend:
    runs-on: ubuntu-slim
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      - name: lint and format
        run: pnpm biome ci
      - name: translations sorted
        run: |
          ./translations/sort-locale.sh
          git diff --exit-code -- translations
      - name: translation keys exist
        run: ./translations/check-keys.sh
      - name: unit tests
        run: node --test 'src/**/*.test.js'
      - name: build
        run: pnpm vite build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca # master
        with:
          check_together: 'yes'
      - name: dockerfile
        run: |
          curl -sSfL https://github.com/hadolint/hadolint/releases/download/v2.14.0/hadolint-linux-x86_64 -o "$RUNNER_TEMP/hadolint"
          chmod +x "$RUNNER_TEMP/hadolint"
          git ls-files '*Dockerfile' | xargs -n1 "$RUNNER_TEMP/hadolint" --ignore DL3018 --ignore DL3003 --ignore DL3013
      - name: workflows
        run: |
          curl -sSfL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz | tar -xz -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -ignore SC2086 -ignore SC2012
      - name: json syntax
        run: git ls-files '*.json' | xargs -n1 jq empty
      - name: old project name
        run: sh .github/scripts/check-names.sh
      - name: compose.yaml variables
        run: sh .github/scripts/check-compose-envs.sh
      - name: nginx config format
        run: |
          npx --yes nginxbeautifier@1.0.19 -s 2 -r rootfs/usr/local/nginx/conf
          git diff --exit-code -- rootfs/usr/local/nginx/conf
      - uses: codespell-project/actions-codespell@e3258cca84ce02b0bb36a3d41f2c18f719a0cc1a # v2.4.3
        with:
          check_filenames: true
          check_hidden: true
          skip: pnpm-lock.yaml,./frontend/translations
          ignore_words_list: afterAll,alog,clen,Nd,hasTable
