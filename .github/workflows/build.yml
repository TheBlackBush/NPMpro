name: Build and Push Docker Image
on:
  workflow_call:
    inputs:
      version:
        description: version prefix shown in the app, the short commit hash is appended
        required: true
        type: string
      tags:
        description: space separated image tags to publish
        required: true
        type: string
    secrets:
      DOCKER_USERNAME:
        description: Docker Hub user, the copy to Docker Hub is skipped when this or the token is missing
        required: false
      DOCKER_TOKEN:
        description: Docker Hub access token
        required: false
permissions: {}
env:
  GHCR_IMAGE: ghcr.io/theblackbush/npmpro
  DOCKER_IMAGE: blackbush/npmpro
jobs:
  build-x86_64:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: build
        uses: ./.github/actions/build-image
        with:
          platform: linux/amd64
          cache-scope: x86_64
          flags: -march=x86-64-v2 -mtune=generic -fcf-protection=full
          version: ${{ inputs.version }}
          image: ${{ env.GHCR_IMAGE }}
          token: ${{ github.token }}

  build-aarch64:
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: build
        uses: ./.github/actions/build-image
        with:
          platform: linux/arm64
          cache-scope: aarch64
          flags: -mbranch-protection=standard
          version: ${{ inputs.version }}
          image: ${{ env.GHCR_IMAGE }}
          token: ${{ github.token }}

  merge:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write
    needs: [build-x86_64, build-aarch64]
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_TOKEN != '' }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: ghcr.io-login
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}
      - name: docker.io-login
        if: ${{ env.HAS_DOCKERHUB == 'true' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: merge
        env:
          TAGS: ${{ inputs.tags }}
          DIGEST_X86_64: ${{ needs.build-x86_64.outputs.digest }}
          DIGEST_AARCH64: ${{ needs.build-aarch64.outputs.digest }}
        run: |
          set --
          for tag in $TAGS; do
            set -- "$@" --tag "$GHCR_IMAGE:$tag"
            if [ "$HAS_DOCKERHUB" = "true" ]; then
              set -- "$@" --tag "$DOCKER_IMAGE:$tag"
            fi
          done
          if [ "$HAS_DOCKERHUB" != "true" ]; then
            echo "::warning::DOCKER_USERNAME/DOCKER_TOKEN secrets are not set, only pushing to ghcr.io"
          fi
          docker buildx imagetools create "$@" "$GHCR_IMAGE@$DIGEST_X86_64" "$GHCR_IMAGE@$DIGEST_AARCH64"
          for tag in $TAGS; do
            docker buildx imagetools inspect "$GHCR_IMAGE:$tag"
          done
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: sign and verify
        env:
          TAGS: ${{ inputs.tags }}
        run: |
          first="${TAGS%% *}"
          digest="$(docker buildx imagetools inspect "$GHCR_IMAGE:$first" --format '{{json .Manifest}}' | jq -r .digest)"
          set -- "$GHCR_IMAGE@$digest"
          if [ "$HAS_DOCKERHUB" = "true" ]; then
            set -- "$@" "$DOCKER_IMAGE@$digest"
          fi
          for image in "$@"; do
            cosign sign --yes "$image"
            # Docker Hub lists a new signature a few seconds after the push, so the check is retried
            for attempt in 1 2 3 4 5 6; do
              if cosign verify "$image" \
                --certificate-identity-regexp '^https://github.com/TheBlackBush/NPMpro/' \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null; then
                echo "signed and verified: $image"
                continue 2
              fi
              echo "::warning::signature of $image not found yet (attempt $attempt of 6)"
              sleep 10
            done
            echo "::error::the signature of $image could not be verified"
            exit 1
          done
