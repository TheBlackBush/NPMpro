name: Build and Push Docker Image
on:
  workflow_call:
    inputs:
      version:
        description: version prefix shown in the app, the short commit hash is appended
        required: true
        type: string
      tags:
        description: space separated image tags to publish
        required: true
        type: string
permissions: {}
env:
  GHCR_IMAGE: ghcr.io/theblackbush/npmpro
  DOCKER_IMAGE: blackbush/npmpro
jobs:
  build-x86_64:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: env.BUILDKIT_STEP_LOG_MAX_SIZE=-1
      - name: ghcr.io-login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}
      - name: version
        run: |
          v="${{ inputs.version }}-$(git rev-parse --short HEAD)"
          for pkg in frontend/package.json backend/package.json; do
            jq --arg v "$v" '.version = $v' "$pkg" > "$pkg.tmp" && mv "$pkg.tmp" "$pkg"
          done
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=x86_64
          cache-to: type=gha,scope=x86_64,mode=max
          build-args: |
            FLAGS=-march=x86-64-v2 -mtune=generic -fcf-protection=full

  build-aarch64:
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: env.BUILDKIT_STEP_LOG_MAX_SIZE=-1
      - name: ghcr.io-login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}
      - name: version
        run: |
          v="${{ inputs.version }}-$(git rev-parse --short HEAD)"
          for pkg in frontend/package.json backend/package.json; do
            jq --arg v "$v" '.version = $v' "$pkg" > "$pkg.tmp" && mv "$pkg.tmp" "$pkg"
          done
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=aarch64
          cache-to: type=gha,scope=aarch64,mode=max
          build-args: |
            FLAGS=-mbranch-protection=standard

  merge:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    needs: [build-x86_64, build-aarch64]
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_TOKEN != '' }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: ghcr.io-login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}
      - name: docker.io-login
        if: ${{ env.HAS_DOCKERHUB == 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: merge
        env:
          TAGS: ${{ inputs.tags }}
          DIGEST_X86_64: ${{ needs.build-x86_64.outputs.digest }}
          DIGEST_AARCH64: ${{ needs.build-aarch64.outputs.digest }}
        run: |
          set --
          for tag in $TAGS; do
            set -- "$@" --tag "$GHCR_IMAGE:$tag"
            if [ "$HAS_DOCKERHUB" = "true" ]; then
              set -- "$@" --tag "$DOCKER_IMAGE:$tag"
            fi
          done
          if [ "$HAS_DOCKERHUB" != "true" ]; then
            echo "::warning::DOCKER_USERNAME/DOCKER_TOKEN secrets are not set, only pushing to ghcr.io"
          fi
          docker buildx imagetools create "$@" "$GHCR_IMAGE@$DIGEST_X86_64" "$GHCR_IMAGE@$DIGEST_AARCH64"
          for tag in $TAGS; do
            docker buildx imagetools inspect "$GHCR_IMAGE:$tag"
          done
