name: Docker Image
on:
  push:
    branches:
      - develop
  pull_request:
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  smoke-test:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the PR merge commit and its first parent (the base), for Changed Certbot Files
          fetch-depth: 2
      - name: Build Arguments
        id: args
        uses: ./.github/actions/build-args
        with:
          version: ci
      - name: Set Up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: env.BUILDKIT_STEP_LOG_MAX_SIZE=-1
      - name: Build Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: npmpro:test
          cache-from: type=gha,scope=x86_64
          build-args: |
            FLAGS=-march=x86-64-v2 -mtune=generic -fcf-protection=full
            VERSION=${{ steps.args.outputs.version }}
            ALPINE_REFRESH=${{ steps.args.outputs.week }}
      - name: Set Up Node and pnpm
        uses: ./.github/actions/setup
        with:
          project: frontend
      - name: First User Password
        run: |
          password="Ci-$(openssl rand -hex 12)-9"
          echo "::add-mask::$password"
          echo "CHECK_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Start and Wait Until Healthy
        run: |
          mkdir -p "$RUNNER_TEMP/data"
          docker run -d --name npmpro --network host -e TZ=UTC -e ACME_EMAIL=flow-acme@example.com -v "$RUNNER_TEMP/data:/data" npmpro:test
          for _ in $(seq 1 60); do
            if docker exec npmpro healthcheck.sh > /dev/null 2>&1; then
              curl -sSk https://127.0.0.1:81/api | tee /dev/stderr | jq -e '.status == "OK"' > /dev/null
              echo "NPMpro is healthy"
              exit 0
            fi
            sleep 5
          done
          echo "::error::NPMpro did not become healthy within 5 minutes"
          exit 1
      - name: Version Reaches the App
        env:
          WANT: ${{ steps.args.outputs.version }}
        run: |
          got="$(docker exec npmpro jq -r .version /app/package.json)"
          if [ "$got" != "$WANT" ]; then
            echo "::error::/app/package.json has '$got', the build was given '$WANT'"
            exit 1
          fi
          if ! docker logs npmpro 2>&1 | grep -qxF "Version:  $WANT"; then
            echo "::error::the start log does not show 'Version:  $WANT'"
            exit 1
          fi
      - name: Image Runs the CI Node Major
        run: |
          image="$(docker exec npmpro node --version)"
          want="v$(cat .node-version)"
          if [ "${image%%.*}" != "$want" ]; then
            echo "::error::image runs $image, .node-version says ${want#v}"
            exit 1
          fi
      - name: Install Dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Playwright Version
        id: playwright
        working-directory: frontend
        run: echo "version=$(node -p 'require("./package.json").devDependencies.playwright')" >> "$GITHUB_OUTPUT"
      - name: Browser Cache
        id: browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium-headless-shell
      - name: Install Browser
        working-directory: frontend
        env:
          CACHE_HIT: ${{ steps.browser-cache.outputs.cache-hit }}
        # the runner image already has Chrome's libraries; the system packages come from the Ubuntu mirror and are
        # tried only when the browser itself is not cached (the CSP check fails if a library is missing)
        run: |
          if [ "$CACHE_HIT" = true ]; then
            pnpm exec playwright install --only-shell chromium
            exit 0
          fi
          for attempt in 1 2; do
            timeout 300 pnpm exec playwright install --with-deps --only-shell chromium && exit 0
            echo "::warning::browser install with system packages failed (attempt $attempt of 2)"
            [ "$attempt" -lt 2 ] && sleep 10
          done
          echo "::warning::installing the browser without system packages"
          pnpm exec playwright install --only-shell chromium
      - name: No CSP Violation or Page Error
        working-directory: frontend
        env:
          CSP_CHECK_PASSWORD: ${{ env.CHECK_PASSWORD }}
        run: node scripts/csp-check.js https://127.0.0.1:81 chromium
      - name: Browser Flows
        working-directory: frontend
        env:
          FLOWS_PASSWORD: ${{ env.CHECK_PASSWORD }}
        run: node scripts/flows/run.js https://127.0.0.1:81 chromium
      - name: nginx Accepts Every Host Type
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
        run: node .github/scripts/config-check.js https://127.0.0.1:81
      - name: Log Lines Match the Parsers
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
        run: node .github/scripts/log-sample-check.js https://127.0.0.1:81
      - name: nginx Config Test
        run: docker exec npmpro nginx -t
      - name: Changed Certbot Files
        id: certbot
        # the PR's merge commit against its first parent, the base it was merged onto (a rerun compares the same pair)
        run: |
          if git diff --quiet HEAD^1 HEAD -- backend/certbot Dockerfile .github/scripts/dns-plugins-check.sh; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Every DNS Plugin Installs
        if: ${{ steps.certbot.outputs.changed == 'true' }}
        run: sh .github/scripts/dns-plugins-check.sh npmpro
      - name: PUID Binds Low Ports
        run: .github/scripts/puid-low-ports.sh npmpro:test npmpro-puid
      - name: Container Logs
        if: ${{ failure() }}
        run: docker logs npmpro

  browser-cache:
    # a pull request reads only its own caches and its base branch's: this job writes the smoke test's browser cache in
    # develop's scope (same runner, same key), so pull requests restore it instead of downloading the browser
    name: Browser Cache
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set Up Node and pnpm
        uses: ./.github/actions/setup
        with:
          project: frontend
      - name: Install Dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Playwright Version
        id: playwright
        working-directory: frontend
        run: echo "version=$(node -p 'require("./package.json").devDependencies.playwright')" >> "$GITHUB_OUTPUT"
      - name: Browser Cache
        id: browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium-headless-shell
      - name: Download Browser
        if: ${{ steps.browser-cache.outputs.cache-hit != 'true' }}
        working-directory: frontend
        run: pnpm exec playwright install --only-shell chromium

  publish:
    name: Publish
    if: ${{ github.event_name != 'pull_request' && github.repository_owner == 'TheBlackBush' }}
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/build.yml
    with:
      version: develop
      tags: develop
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
