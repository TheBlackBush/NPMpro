name: Docker Image
on:
  push:
    branches:
      - develop
  pull_request:
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  smoke-test:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build arguments
        id: args
        run: |
          echo "version=ci-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: env.BUILDKIT_STEP_LOG_MAX_SIZE=-1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: npmpro:test
          cache-from: type=gha,scope=x86_64
          build-args: |
            FLAGS=-march=x86-64-v2 -mtune=generic -fcf-protection=full
            VERSION=${{ steps.args.outputs.version }}
            ALPINE_REFRESH=${{ steps.args.outputs.week }}
      - uses: ./.github/actions/setup
      - name: password of the first user
        run: |
          password="Ci-$(openssl rand -hex 12)-9"
          echo "::add-mask::$password"
          echo "CHECK_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: start container and wait until healthy
        run: |
          mkdir -p "$RUNNER_TEMP/data"
          docker run -d --name npmpro --network host -e TZ=UTC -v "$RUNNER_TEMP/data:/data" npmpro:test
          for _ in $(seq 1 60); do
            if docker exec npmpro healthcheck.sh > /dev/null 2>&1; then
              curl -sSk https://127.0.0.1:81/api | tee /dev/stderr | jq -e '.status == "OK"' > /dev/null
              echo "NPMpro is healthy"
              exit 0
            fi
            sleep 5
          done
          echo "::error::NPMpro did not become healthy within 5 minutes"
          exit 1
      - name: the version reaches the app
        env:
          WANT: ${{ steps.args.outputs.version }}
        run: |
          got="$(docker exec npmpro jq -r .version /app/package.json)"
          if [ "$got" != "$WANT" ]; then
            echo "::error::/app/package.json has '$got', the build was given '$WANT'"
            exit 1
          fi
          if ! docker logs npmpro 2>&1 | grep -qxF "Version:  $WANT"; then
            echo "::error::the start log does not show 'Version:  $WANT'"
            exit 1
          fi
      - name: the image runs the Node major CI tests on
        run: |
          image="$(docker exec npmpro node --version)"
          want="v$(cat .node-version)"
          if [ "${image%%.*}" != "$want" ]; then
            echo "::error::image runs $image, .node-version says ${want#v}"
            exit 1
          fi
      - name: install the browser for the CSP check
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          # the system packages come from the Ubuntu mirror; the runner image already has Chrome's libraries, so when
          # the mirror cannot be reached the browser alone is enough (the CSP check fails if a library is missing)
          for attempt in 1 2; do
            timeout 300 pnpm exec playwright install --with-deps --only-shell chromium && exit 0
            echo "::warning::browser install with system packages failed (attempt $attempt of 2)"
            [ "$attempt" -lt 2 ] && sleep 10
          done
          echo "::warning::installing the browser without system packages"
          pnpm exec playwright install --only-shell chromium
      - name: no CSP violation or page error on any page, menu or window
        working-directory: frontend
        env:
          CSP_CHECK_PASSWORD: ${{ env.CHECK_PASSWORD }}
        run: node scripts/csp-check.js https://127.0.0.1:81 chromium
      - name: browser flows of the host lists, windows, settings and language
        working-directory: frontend
        env:
          FLOWS_PASSWORD: ${{ env.CHECK_PASSWORD }}
        run: node scripts/flows/run.js https://127.0.0.1:81 chromium
      - name: nginx accepts every host type
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
        run: node .github/scripts/config-check.js https://127.0.0.1:81
      - name: nginx -t on the whole config
        run: docker exec npmpro nginx -t
      - name: PUID binds ports below 1024 without the host sysctl
        run: .github/scripts/puid-low-ports.sh npmpro:test npmpro-puid
      - name: container logs
        if: ${{ failure() }}
        run: docker logs npmpro

  publish:
    if: ${{ github.event_name != 'pull_request' && github.repository_owner == 'TheBlackBush' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build.yml
    with:
      version: develop
      tags: develop
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
