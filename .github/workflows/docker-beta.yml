name: Build Beta Docker Image
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
env:
  GHCR_IMAGE: ghcr.io/theblackbush/npmpro
  DOCKER_IMAGE: blackbush/npmpro
jobs:
  version:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    if: ${{ github.repository_owner == 'TheBlackBush' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: version
        id: version
        run: |
          version="$(tr -d '[:space:]' < .version)"
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::.version must be MAJOR.MINOR.PATCH, got '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-x86_64:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs: version
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: env.BUILDKIT_STEP_LOG_MAX_SIZE=-1
      - name: ghcr.io-login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}
      - name: version
        run: |
          jq --arg v "${{ needs.version.outputs.version }}-beta-$(git rev-parse --short HEAD)" '.version = $v' frontend/package.json > frontend/package.json.tmp && mv frontend/package.json.tmp frontend/package.json
          jq --arg v "${{ needs.version.outputs.version }}-beta-$(git rev-parse --short HEAD)" '.version = $v' backend/package.json > backend/package.json.tmp && mv backend/package.json.tmp backend/package.json
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.GHCR_IMAGE }}:beta-x86_64
          build-args: |
            FLAGS=-march=x86-64-v2 -mtune=generic -fcf-protection=full

  build-aarch64:
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      packages: write
    needs: version
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: env.BUILDKIT_STEP_LOG_MAX_SIZE=-1
      - name: ghcr.io-login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}
      - name: version
        run: |
          jq --arg v "${{ needs.version.outputs.version }}-beta-$(git rev-parse --short HEAD)" '.version = $v' frontend/package.json > frontend/package.json.tmp && mv frontend/package.json.tmp frontend/package.json
          jq --arg v "${{ needs.version.outputs.version }}-beta-$(git rev-parse --short HEAD)" '.version = $v' backend/package.json > backend/package.json.tmp && mv backend/package.json.tmp backend/package.json
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.GHCR_IMAGE }}:beta-aarch64
          build-args: |
            FLAGS=-mbranch-protection=standard

  merge:
    runs-on: ubuntu-slim
    permissions:
      packages: write
    needs: [version, build-x86_64, build-aarch64]
    steps:
      - name: docker.io-login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: ghcr.io-login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}
      - name: merge
        run: |
          for tag in beta "${{ needs.version.outputs.version }}-beta"; do
            docker buildx imagetools create --tag "$DOCKER_IMAGE:$tag" "$GHCR_IMAGE:beta-x86_64" "$GHCR_IMAGE:beta-aarch64"
            docker buildx imagetools create --tag "$GHCR_IMAGE:$tag" "$GHCR_IMAGE:beta-x86_64" "$GHCR_IMAGE:beta-aarch64"
          done
