name: Setup
description: Node from .node-version and the one pinned pnpm version, with the pnpm store cached per project
inputs:
  project:
    description: backend or frontend, whose pnpm-lock.yaml keys the pnpm store cache; empty for no cache
    required: false
    default: ""
runs:
  using: composite
  steps:
    # pnpm first: setup-node's pnpm cache asks pnpm for its store path
    - name: Set Up pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        version: 12.22.0
    - name: Set Up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        cache: ${{ inputs.project != '' && 'pnpm' || '' }}
        cache-dependency-path: ${{ inputs.project != '' && format('{0}/pnpm-lock.yaml', inputs.project) || '' }}
