name: build-image
description: Builds one architecture and pushes it to GHCR by digest
inputs:
  platform:
    description: for example linux/amd64
    required: true
  cache-scope:
    description: build cache scope of this architecture
    required: true
  flags:
    description: compiler flags for the FLAGS build argument
    required: true
  version:
    description: version prefix shown in the app, the short commit hash is appended
    required: true
  image:
    description: GHCR image name
    required: true
  token:
    description: token that may push to GHCR
    required: true
outputs:
  digest:
    description: digest of the pushed image
    value: ${{ steps.build.outputs.digest }}
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        driver-opts: env.BUILDKIT_STEP_LOG_MAX_SIZE=-1
    - name: ghcr.io-login
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ inputs.token }}
    - name: version
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        v="$VERSION-$(git rev-parse --short HEAD)"
        for pkg in frontend/package.json backend/package.json; do
          jq --arg v "$v" '.version = $v' "$pkg" > "$pkg.tmp" && mv "$pkg.tmp" "$pkg"
        done
    - id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        platforms: ${{ inputs.platform }}
        labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
        outputs: type=image,name=${{ inputs.image }},push-by-digest=true,name-canonical=true,push=true
        cache-from: type=gha,scope=${{ inputs.cache-scope }}
        cache-to: type=gha,scope=${{ inputs.cache-scope }},mode=max
        build-args: |
          FLAGS=${{ inputs.flags }}
